<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शुभ तीज निमंत्रण</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:wght@500;600&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background: #041713;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: radial-gradient(ellipse at center, #0e4a40 0%, #0a3229 70%, #061f19 100%);
    border: 2px solid #d9b45f;
    outline: 1px solid #d9b45f;
    outline-offset: 6px;
    border-radius: 6px;
    padding: 42px 32px 48px;
    overflow: hidden;
    color: #f3ead9;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }

  /* Rain / Droplet Animation Container */
  .rain-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
  }

  .droplet {
    position: absolute;
    background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(217,180,95,0.2));
    width: 3px;
    height: 12px;
    border-radius: 50%;
    opacity: 0;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% {
      transform: translateY(-20px) scale(0.6);
      opacity: 0;
    }
    20% {
      opacity: 0.7;
    }
    100% {
      transform: translateY(600px) scale(1);
      opacity: 0;
    }
  }

  .vine-side {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30px;
    z-index: 1;
    opacity: 0.9;
  }
  .vine-left { left: 2px; }
  .vine-right { right: 2px; transform: scaleX(-1); }

  .flower-corner {
    position: absolute;
    width: 210px;
    height: 210px;
    pointer-events: none;
    z-index: 2;
  }
  .flower-corner svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
  .top-left { top: -45px; left: -45px; }
  .top-right { top: -45px; right: -45px; transform: scaleX(-1); }
  .bottom-left { bottom: -45px; left: -45px; transform: scaleY(-1); }
  .bottom-right { bottom: -45px; right: -45px; transform: scale(-1,-1); }

  .content { position: relative; z-index: 3; }

  /* Top Border matching exact corner pattern/colors */
  .top-edge-floral {
    position: absolute;
    top: -45px;
    left: 0;
    right: 0;
    height: 120px;
    pointer-events: none;
    z-index: 2;
  }
  .top-edge-floral svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }

  .song-banner {
    font-family: 'Dancing Script', cursive;
    font-size: 24px;
    color: #f1c40f;
    letter-spacing: 1px;
    margin: 12px 0 10px;
    text-shadow: 0 0 8px rgba(241,196,15,0.3);
  }

  .swing-wrap { margin: 10px auto 8px; width: 220px; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4)); }

  .subtitle { font-size: 14px; letter-spacing: 0.5px; color: #eae2d0; margin: 2px 0 2px; }

  .event-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1px;
    color: #ffffff;
    margin: 2px 0 10px;
    text-transform: uppercase;
  }

  .script-title {
    font-family: 'Dancing Script', cursive;
    font-size: 54px;
    color: #e9b949;
    text-shadow: 0 0 15px rgba(233,185,73,0.5);
    margin: 2px 0 8px;
    line-height: 1;
  }

  .on-label { letter-spacing: 3px; font-size: 13px; color: #d8cfba; margin-bottom: 6px; }

  .date-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid #d9b45f;
    border-radius: 30px;
    padding: 5px 16px;
    font-size: 17px;
    color: #f3ead9;
    margin-bottom: 6px;
    background: rgba(10, 50, 41, 0.6);
  }

  .date-pill .day-badge {
    background: #e9b949;
    color: #0a3229;
    font-weight: 700;
    font-size: 19px;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .year { font-size: 15px; letter-spacing: 2px; margin: 6px 0 2px; }
  .time {
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
  }

  .place-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 19px;
    color: #e9b949;
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }

  .address { font-size: 13px; letter-spacing: 1px; color: #ece4d3; margin-bottom: 10px; }

  .divider { color: #d9b45f; font-size: 12px; letter-spacing: 4px; margin: 8px 0; }

  .footer-note { font-style: italic; font-size: 14px; color: #f3ead9; }

  .editable { border-radius: 4px; cursor: text; }
  .editable:hover, .editable:focus {
    outline: 1px dashed #e9b949;
    background: rgba(233,185,73,0.08);
  }

  /* Music Control Floating Button */
  .music-control {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0e4a40;
    border: 2px solid #d9b45f;
    color: #f3ead9;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.3s;
  }
  .music-control:hover {
    background: #136355;
  }

  @media print {
    body { background: white; padding: 0; }
    .card { outline: none; box-shadow: none; }
    .rain-container { display: none; }
    .music-control { display: none; }
  }
</style>
</head>

<script>
  // Script to generate cascading floral raindrops / droplets dynamically
  const rainContainer = document.getElementById('rainContainer');
  const dropletCount = 25;

  for (let i = 0; i < dropletCount; i++) {
    const droplet = document.createElement('div');
    droplet.classList.add('droplet');
    
    const leftPos = Math.random() * 100;
    const animDuration = 3 + Math.random() * 4; 
    const animDelay = Math.random() * 5;       
    const scaleVal = 0.5 + Math.random() * 0.8;
    
    droplet.style.left = `${leftPos}%`;
    droplet.style.animationDuration = `${animDuration}s`;
    droplet.style.animationDelay = `${animDelay}s`;
    droplet.style.transform = `scale(${scaleVal})`;
    
    rainContainer.appendChild(droplet);
  }

  // Audio Play/Pause Control Script & Autoplay Handling
  const bgMusic = document.getElementById('bgMusic');
  const musicToggleBtn = document.getElementById('musicToggleBtn');
  const btnText = document.getElementById('btnText');
  let isPlaying = true; // Assume playing since autoplay is requested

  // Attempt to play automatically on load
  window.addEventListener('DOMContentLoaded', () => {
    bgMusic.play().then(() => {
      isPlaying = true;
      btnText.textContent = "संगीत रोकें";
      musicToggleBtn.querySelector('span:first-child').textContent = "⏸️";
    }).catch(error => {
      // Browsers block autoplay until user interaction occurs
      console.log("Autoplay blocked by browser policy. Waiting for user interaction.");
      isPlaying = false;
      btnText.textContent = "संगीत चलाएं";
      musicToggleBtn.querySelector('span:first-child').textContent = "🎵";
    });
  });

  function toggleMusic() {
    if (isPlaying) {
      bgMusic.pause();
      btnText.textContent = "संगीत चलाएं";
      musicToggleBtn.querySelector('span:first-child').textContent = "🎵";
      isPlaying = false;
    } else {
      bgMusic.play().then(() => {
        btnText.textContent = "संगीत रोकें";
        musicToggleBtn.querySelector('span:first-child').textContent = "⏸️";
        isPlaying = true;
      }).catch(error => {
        console.log("Audio playback error: ", error);
      });
    }
  }
</script>
